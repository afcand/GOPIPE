[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gopipe"
version = "0.1.0"
description = "GOPIPE: 配管・設備工事業者向け 拾い出し（積算）エンジン。GOREFORM track-a を母体に転用。"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "pymupdf>=1.24.0",
    # symbol_match.py（記号テンプレート照合）が必須とする。宣言が無く、
    # クリーンな環境では import すら通らなかった＝機能が置物になっていた。
    "numpy>=1.26",
    "openpyxl>=3.1.2",
    "pillow>=10.3.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "black>=24.4.0",
]
web = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["shared", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["shared", "src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]
